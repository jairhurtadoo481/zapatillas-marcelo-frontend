<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Sin conexión | La Casa de Marcelo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(#111827, #000); color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; text-align: center;
    }
    main { max-width: 320px; }
    img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #fff; color: #000; border: 0; border-radius: 8px; padding: 12px 28px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="La Casa de Marcelo">
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Los precios y el stock necesitan conexión para mostrarse al día. Revisa tu señal e inténtalo otra vez.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
